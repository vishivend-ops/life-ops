<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b7285" />
  <title>Life Ops</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/styles.css" />

  <!-- Very small touch icon (used if no separate icon file) -->
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Life Ops</h1>
      <p class="subtitle">Simple recurring personal tasks — local only</p>
    </header>

    <main>
      <form id="addForm" autocomplete="off">
        <input id="title" placeholder="Task (e.g., Haircut)" required />
        <input id="days" type="number" min="1" value="30" required />
        <button id="addBtn" type="submit">Add</button>
      </form>

      <ul id="list" aria-live="polite"></ul>

      <p class="hint">Tap "Done" to reset the cycle. Data stays on this phone only.</p>
    </main>

    <footer>
      <small>Built minimal. No cloud, no login.</small>
    </footer>
  </div>

  <script src="/app.js"></script>
  <script>
    // Register service worker for offline / installability
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(err){
        console.warn('SW registration failed:', err);
      });
    }
  </script>
</body>
</html>
